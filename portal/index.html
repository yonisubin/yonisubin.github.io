<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Twinfold — a first-person puzzle game about two linked openings, in the browser." />
    <title>Twinfold</title>
    <style>
      :root {
        --ink: #e8ecef;
        --dim: #9aa6b1;
        --bg: #15181b;
        --panel: rgba(14, 17, 20, 0.86);
        --line: #3a434c;
        --blue: #2f8cff;
        --amber: #ffa31a;
        --good: #37d67a;
        --bad: #ff5a4f;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #menuBg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        display: none;
      }

      /* ---- HUD ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.8));
      }
      #debug {
        position: absolute;
        left: 10px;
        top: 10px;
        white-space: pre;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        border-radius: 6px;
        display: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(180, 0, 0, 0) 45%, rgba(190, 10, 10, 0.85) 100%);
      }
      #prompt {
        position: absolute;
        left: 50%;
        top: calc(50% + 34px);
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      #subtitles {
        position: absolute;
        left: 50%;
        bottom: 9vh;
        transform: translateX(-50%);
        max-width: min(760px, 86vw);
        padding: 8px 16px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.62);
        font-size: 18px;
        line-height: 1.4;
        text-align: center;
      }
      #subtitles .speaker {
        color: #9fd0ff;
        font-weight: 600;
      }
      #captions {
        position: absolute;
        left: 16px;
        bottom: 16px;
        font-size: 14px;
        color: #f4e3b5;
        text-shadow: 0 1px 2px #000;
      }
      #challengeHud {
        position: absolute;
        right: 14px;
        top: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font: 14px ui-monospace, Menlo, Consolas, monospace;
      }
      #chamberCard {
        position: absolute;
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        min-width: 280px;
        padding: 18px 28px;
        border-radius: 10px;
        background: var(--panel);
        border-top: 3px solid var(--good);
        text-align: center;
        font: 15px/1.7 ui-monospace, Menlo, Consolas, monospace;
      }
      #chamberCard h2 {
        margin: 0 0 6px;
        font: 300 26px system-ui, sans-serif;
        letter-spacing: 0.08em;
      }
      #chamberCard .sub {
        opacity: 0.65;
        margin-top: 8px;
      }
      #toast {
        position: absolute;
        right: 16px;
        bottom: 16px;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        font-size: 14px;
      }

      /* ---- Menus ---- */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: none;
        align-items: center;
        justify-content: flex-start;
        padding-left: 7vw;
        background: linear-gradient(90deg, rgba(13, 16, 19, 0.88) 0%, rgba(13, 16, 19, 0.55) 45%, rgba(13, 16, 19, 0) 75%), linear-gradient(160deg, #dfe4e8, #aab4bc);
      }
      #overlay.inGame {
        background: rgba(10, 12, 14, 0.72);
        justify-content: center;
        padding-left: 0;
      }
      #overlay .panel {
        max-height: 92vh;
        overflow: auto;
        width: min(560px, 90vw);
      }
      .logoWrap {
        color: var(--ink);
        margin-bottom: 18px;
      }
      .logoWrap svg {
        width: min(420px, 80vw);
        height: auto;
      }
      .mainMenu {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      #overlay button {
        background: none;
        border: 0;
        padding: 6px 10px;
        font-size: 19px;
        letter-spacing: 0.06em;
        text-align: left;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: border-color 0.12s, background 0.12s;
      }
      #overlay button:hover:not([disabled]),
      #overlay button:focus-visible {
        border-left-color: var(--amber);
        background: rgba(255, 255, 255, 0.06);
        outline: none;
      }
      #overlay button.primary {
        border-left-color: var(--blue);
      }
      #overlay button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      #overlay h2 {
        font-weight: 300;
        letter-spacing: 0.1em;
        margin: 0 0 12px;
      }
      #overlay .sub,
      #overlay .note,
      #overlay .foot {
        color: var(--dim);
        font-size: 14px;
      }
      #overlay .foot {
        margin-top: 26px;
        max-width: 380px;
      }
      #overlay .menuRow {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      #overlay .slot {
        display: block;
        width: 100%;
        font-size: 16px;
      }
      #overlay .slot small {
        display: block;
        color: var(--dim);
        font-size: 12px;
      }
      #overlay .list > button {
        display: block;
      }
      .challenge {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      .challenge h3 {
        margin: 4px 0;
        font-weight: 500;
      }
      .challenge .mode {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
        align-items: center;
        margin: 6px 0;
      }
      .challenge .mode small {
        color: var(--dim);
        grid-column: 1;
      }
      .challenge .mode button {
        grid-column: 2;
        grid-row: 1 / span 3;
      }
      .board {
        margin: 2px 0 8px;
        color: var(--dim);
        font: 12px ui-monospace, Menlo, Consolas, monospace;
      }
      .medal {
        font-size: 22px;
      }
      .medal.gold {
        color: #ffd34d;
      }
      .medal.silver {
        color: #d5dde3;
      }
      .medal.bronze {
        color: #d08a4c;
      }
      .titleCard {
        text-align: left;
      }
      .titleCard > button {
        display: block;
      }
      .error {
        color: var(--bad);
        white-space: pre-wrap;
        font-size: 13px;
      }

      /* options */
      .options .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        margin-bottom: 10px;
      }
      #overlay .options .tabs button {
        font-size: 14px;
        border-left: 0;
        border-bottom: 2px solid transparent;
      }
      #overlay .options .tabs button.on {
        border-bottom-color: var(--blue);
      }
      .options .row {
        display: grid;
        grid-template-columns: 1fr 180px 56px;
        gap: 8px;
        align-items: center;
        padding: 4px 0;
        font-size: 15px;
      }
      .options .row small {
        color: var(--dim);
      }
      .options .row select {
        grid-column: 2 / span 2;
        background: #1f252b;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px;
      }
      .options .row input[type='checkbox'] {
        justify-self: start;
      }
      .options .val {
        color: var(--dim);
        font-size: 13px;
      }
      .swatch span {
        display: inline-block;
        width: 40px;
        height: 14px;
        margin-right: 6px;
        border-radius: 3px;
      }
      .bindings {
        display: grid;
        grid-template-columns: 1fr 120px 120px;
        gap: 2px 6px;
        align-items: center;
        margin-top: 10px;
        font-size: 14px;
      }
      #overlay .bindings button {
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 4px;
        text-align: center;
        padding: 3px;
      }
      #overlay .bindings button.waiting {
        border-color: var(--amber);
      }
      body.highContrast #vignette {
        background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0) 40%, rgba(255, 0, 0, 1) 100%);
      }

      /* ---- Puzzle maker ---- */
      #editor {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        grid-template-columns: 170px 1fr 300px;
        grid-template-rows: auto 1fr auto;
        background: #1b1f24;
        font-size: 13px;
      }
      #editor button {
        background: #262d34;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #editor button:hover:not([disabled]) {
        border-color: #6d7a87;
      }
      #editor button.on,
      #editor button.primary {
        border-color: var(--blue);
        background: #1d3a5c;
      }
      #editor button[disabled] {
        opacity: 0.4;
      }
      #editor input,
      #editor select,
      #editor textarea {
        background: #12161a;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 4px;
        min-width: 0;
      }
      .edTop {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
      }
      .edTitle {
        font-weight: 600;
        margin-right: 10px;
      }
      .edTools {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 6px;
        overflow: auto;
        border-right: 1px solid var(--line);
      }
      .edTools button {
        text-align: left;
      }
      .edTools .palette {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .edTools .palette .group {
        color: var(--dim);
        margin-top: 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .edTools .palette i {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 5px;
        border-radius: 2px;
      }
      .edViewport {
        position: relative;
        overflow: hidden;
      }
      .editorCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .edInspector {
        padding: 8px;
        overflow: auto;
        border-left: 1px solid var(--line);
      }
      .edInspector h3 {
        margin: 2px 0 8px;
      }
      .edInspector h4 {
        margin: 12px 0 4px;
        color: var(--dim);
      }
      .edInspector .field {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 6px;
        align-items: center;
        margin: 3px 0;
      }
      .edInspector .field.col {
        grid-template-columns: 1fr;
      }
      .edInspector .vec {
        display: grid;
        grid-template-columns: 100px 1fr 1fr 1fr;
        gap: 4px;
        align-items: center;
        margin: 3px 0;
      }
      .edInspector .row,
      .edInspector .hook,
      .edInspector .wire,
      .edInspector .draft {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      .edInspector .wire span {
        flex: 1;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .edInspector .hook input {
        flex: 1;
      }
      .edInspector .note,
      .edInspector .ports {
        color: var(--dim);
        font-size: 12px;
      }
      .edInspector .err {
        color: var(--bad);
      }
      .edStatus {
        grid-column: 1 / -1;
        display: flex;
        gap: 16px;
        padding: 4px 10px;
        border-top: 1px solid var(--line);
        color: var(--dim);
      }
      .edStatus .bad {
        color: var(--bad);
      }
      .edStatus .warn {
        color: #f5c451;
      }
      .edStatus .good {
        color: var(--good);
      }
      .edModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 11;
      }
      .edModal .card {
        background: #20262c;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        width: min(560px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .edModal textarea {
        width: 100%;
        box-sizing: border-box;
        font: 12px ui-monospace, Menlo, Consolas, monospace;
      }
      .edModal .draft {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .edModal .draft span {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
