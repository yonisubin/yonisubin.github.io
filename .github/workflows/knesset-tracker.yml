name: knesset-tracker

on:
  push:
    branches: [main]
    paths: ["knesset-tracker/**", ".github/workflows/knesset-tracker.yml"]
  pull_request:
    paths: ["knesset-tracker/**", ".github/workflows/knesset-tracker.yml"]

defaults:
  run:
    working-directory: knesset-tracker/backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knesset_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knesset_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knesset_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q

  deploy:
    # Turn on by setting the repository variable WASMER_DEPLOY=true once the secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.WASMER_DEPLOY == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Migrate Neon before deploying
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: alembic upgrade head
      - name: Inject the cron token
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: sed -i "s|__INTERNAL_TOKEN__|${INTERNAL_TOKEN}|g" app.yaml
      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          curl https://get.wasmer.io -sSfL | sh
          ~/.wasmer/bin/wasmer deploy --non-interactive --token "$WASMER_TOKEN"
