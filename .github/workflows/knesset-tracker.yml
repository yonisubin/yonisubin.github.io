name: knesset-tracker

on:
  push:
    branches: [main]
    paths: ["knesset-tracker/**", ".github/workflows/knesset-tracker.yml"]
  pull_request:
    paths: ["knesset-tracker/**", ".github/workflows/knesset-tracker.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: knesset-tracker/backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: knesset_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knesset_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knesset_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: knesset-tracker/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: knesset-tracker/frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: knesset-tracker/frontend/dist }

  # The whole site against a database seeded from the recorded fixtures: Playwright
  # end-to-end tests (including sign-in by email -> follow a bill -> inject a change ->
  # the alert arrives in Mailpit), then the Lighthouse targets (90+ in both locales).
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: knesset_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knesset_e2e
      BASE_URL: http://localhost:8000
      PUBLIC_BASE_URL: http://localhost:8000
      SECRET_KEY: ci-only-not-secret
      COOKIE_SECURE: "0"
      EMAIL_BACKEND: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_URL: http://localhost:8025
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: knesset-tracker/frontend/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: knesset-tracker/frontend/dist }
      - name: Start the app on fixture data
        working-directory: knesset-tracker/backend
        run: |
          pip install -e ".[dev]"   # the seed script reuses the test fixtures
          python -m scripts.seed_fixtures
          nohup uvicorn app.main:app --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: End-to-end tests
        working-directory: knesset-tracker/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --trace off
      - name: Lighthouse (performance and accessibility >= 90, both locales)
        working-directory: knesset-tracker/frontend
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npm run lighthouse
      - if: failure()
        run: cat /tmp/app.log

  deploy:
    # Turn on by setting the repository variable WASMER_DEPLOY=true once the secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.WASMER_DEPLOY == 'true'
    needs: [e2e]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: knesset-tracker/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: knesset-tracker/backend/static }
      - run: pip install -e .
      - name: Migrate Neon before deploying
        env: { DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}" }
        run: alembic upgrade head
      - name: Inject the cron token
        env: { INTERNAL_TOKEN: "${{ secrets.INTERNAL_TOKEN }}" }
        run: sed -i "s|__INTERNAL_TOKEN__|${INTERNAL_TOKEN}|g" app.yaml
      - name: Deploy to Wasmer Edge
        env: { WASMER_TOKEN: "${{ secrets.WASMER_TOKEN }}" }
        run: |
          curl https://get.wasmer.io -sSfL | sh
          ~/.wasmer/bin/wasmer deploy --non-interactive --token "$WASMER_TOKEN"
