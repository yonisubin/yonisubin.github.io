<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Hexborne — a turn-based hex strategy game in the browser." />
    <title>Hexborne</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="setup"></div>
    <div id="pass" style="display: none"></div>
    <div id="game-ui" style="display: none">
      <div id="topbar"></div>
      <div id="notes"></div>
      <div id="hint" style="display: none"></div>
      <div id="unit" style="display: none"></div>
      <div id="city" style="display: none"></div>
      <div id="corner">
        <canvas id="minimap" width="2" height="2"></canvas>
        <div id="endturn"></div>
      </div>
      <div id="modal" style="display: none"></div>
      <div id="tooltip" style="display: none"></div>
      <div id="toast" style="display: none"></div>
      <div id="busy" style="display: none"><div>The other civilizations are taking their turns…</div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
