<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civilization</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10141c; color: #e8e4d8; overflow: hidden;

      canvas { display: block; width: 100%; height: 100%; }
      #banner { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 10px 18px;

      #banner h1 { margin: 0; font-size: 20px; letter-spacing: 0.08em; }
      #banner p { margin: 4px 0 0; font-size: 13px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="banner">
      <h1>CIVILIZATION</h1>
